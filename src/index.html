<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#3964fe" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon-180.png" />
    <!-- 从主屏启动时 iOS 不读 manifest 的 background_color，App 起来之前会先铺一层白，
         夜里看就是一下白闪。这几张图用和开屏同一套几何、同一个深色底（#131315，与
         manifest 一致），把这段盖住；启动图退场、开屏进场时图形位置重合，不会跳。
         亮色主题的用户会先看到一下暗底再转亮——这比白闪好受，而 iOS 启动图的 media
         属性里 prefers-color-scheme 不可靠，所以不做明暗两套。
         只画图形不画名字：开屏里名字是后淡入的，先画上会在交接时闪一次。
         只做 4 个常见尺寸的竖屏，其它机型与横屏启动退回系统默认底色。
         由 scripts/make-splash.mjs 生成。 -->
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="./icons/splash-1290x2796.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="./icons/splash-1179x2556.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="./icons/splash-1170x2532.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
      href="./icons/splash-828x1792.png"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- 状态栏用 default 而不是 black-translucent：black-translucent 会把网页顶到
         状态栏底下、并把时间/信号之类固定画成浅色，而本应用亮色主题是纸色顶栏，
         浅色图标等于看不见。default 由 iOS 跟着深浅色自己选黑字或白字，
         无论什么时候都能读；代价是顶部那条由系统占着，不再压到内容上。 -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="DeepseekChat" />
    <title>DeepseekChat</title>
    <script>
      // 开屏只在 App / 手机网页里出现：DSH 面板内嵌（iframe）直接跳过，
      // 桌面宽屏浏览器也跳过（地址后加 ?boot=1 可强制预览）。
      ;(function () {
        var force = /[?&]boot=1\b/.test(location.search)
        if (!force) {
          var embedded = false
          try {
            embedded = window.self !== window.top
          } catch (e) {
            embedded = true
          }
          if (embedded || window.innerWidth >= 768) return
        }

        var dark = false
        try {
          var pref = localStorage.getItem('chat-demo:theme-preference')
          var sysDark =
            !!window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
          dark = pref === 'dark' || ((pref === null || pref === 'system') && sysDark)
        } catch (e) {}
        var reduce =
          !!window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches

        var root = document.documentElement
        // 让 bootSplash.ts 从「首帧时刻」而不是「JS 包求值时刻」开始算最短停留
        window.__bootStartedAt = window.performance ? window.performance.now() : 0
        root.setAttribute('data-boot', dark ? 'dark' : 'light')
        if (reduce) root.setAttribute('data-boot-reduce', '')
        root.style.backgroundColor = dark ? '#131315' : '#faf9f6'

        // 兜底：JS 包没跑起来（离线、白屏）时也必须让出画面，别把人锁在开屏上。
        window.setTimeout(function () {
          var el = document.getElementById('boot-splash')
          if (!el) return
          el.classList.add('is-leaving')
          window.setTimeout(function () {
            if (el.parentNode) el.parentNode.removeChild(el)
          }, 400)
        }, 4500)
      })()
    </script>
    <style>
      html,
      body {
        margin: 0;
      }
      /*
        开屏压在 #root 之上，等 App 就绪后由 bootSplash.ts 淡出移除。
        图形首帧就是完整可见的——安卓系统开屏只铺一块底色，图形由这里画第一帧，
        所以这里再做一次「出现」动画等于中间闪一下，只做上浮 + 名字淡入。
      */
      #boot-splash {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        align-items: center;
        justify-content: center;
        background: #faf9f6;
        transition: opacity 0.24s ease-out;
      }
      html[data-boot] #boot-splash {
        display: flex;
      }
      #boot-splash.is-leaving {
        opacity: 0;
      }
      /*
        高度仍留 120px，是为了 .boot-name 的 margin-top 不用跟着改，名字与图形的
        间距跟以前一样；宽度 165px 按原图 400x291 的比例算出来。
        图形内联成 data URI 而不是外链：开屏第一帧就要是完整的，外链多一个往返
        回合，在它回来之前开屏上只有底色，图形会后蹦出来一下。
        深浅两个主题都不换色——鲸鱼本身是蓝加白，两种底色上都读得清。
      */
      .boot-mark {
        display: block;
        width: 165px;
        height: 120px;
        object-fit: contain;
        animation: boot-lift 0.45s 0.3s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .boot-name {
        position: absolute;
        left: 0;
        right: 0;
        top: 50%;
        margin-top: 86px;
        text-align: center;
        font: 500 15px/1.4 system-ui, -apple-system, 'Segoe UI', Roboto, 'PingFang SC',
          'Microsoft YaHei', sans-serif;
        letter-spacing: 0.12em;
        color: #201f1b;
        opacity: 0;
        animation: boot-name-in 0.4s 0.34s ease-out forwards;
      }
      html[data-boot='dark'] #boot-splash {
        background: #131315;
      }
      html[data-boot='dark'] .boot-name {
        color: #e8e4da;
      }
      html[data-boot-reduce] .boot-mark,
      html[data-boot-reduce] .boot-name {
        animation: none;
        opacity: 1;
        transform: none;
      }
      @keyframes boot-lift {
        to {
          transform: translateY(-6px);
        }
      }
      @keyframes boot-name-in {
        to {
          opacity: 1;
        }
      }
    </style>
  </head>
