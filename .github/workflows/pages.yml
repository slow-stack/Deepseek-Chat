name: Deploy to GitHub Pages

# 只做一件事：把 Web 版构建出来发到 Pages，给 iPhone「加到主屏」用。
# 仓库 2cc6a3dc 曾删掉上游自带的 Pages 工作流（它跑 pnpm type/lint，且在
# 发布型仓库里没意义），这里另起一份，只负责构建与部署，不碰 APK 发布链。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types
        run: pnpm type

      - name: Lint
        run: pnpm lint

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build
        env:
          NODE_ENV: production
        run: npx rspack build -c rspack.config.ts

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
